<!doctype html><meta charset="utf-8"><title>Double tap movement checks</title><p id="summary">Running</p><iframe src="floor1.html" style="width:1200px;height:800px"></iframe><script type="module">
const frame=document.querySelector('iframe'),results=[];const wait=ms=>new Promise(r=>setTimeout(r,ms));await new Promise(r=>frame.onload=r);await wait(1000);const w=frame.contentWindow,d=frame.contentDocument,c=d.querySelector('#scene'),api=w.floorDemo;
function check(name,pass){results.push({name,pass});}
function doubleAt(x,z){const p=api.projectFloor(x,z);if(!p)throw Error('Point not projected');c.dispatchEvent(new w.MouseEvent('dblclick',{clientX:p.x,clientY:p.y,bubbles:true,cancelable:true}));}
try{
 doubleAt(-18.5,6);check('Double click enters eye-level mode',api.mode==='walk');check('Camera animates',api.traveling);await wait(1800);check('Transition completes',!api.traveling);check('Arrives at picked floor point',Math.hypot(api.eye[0]+18.5,api.eye[2]-6)<.25);
 doubleAt(-18.5,5.5);check('Second floor click moves inside',Math.abs(api.eye[2]-5.5)<.25);await wait(850);
 const before=api.eye;doubleAt(-21,0);check('Wall blocks direct crossing',api.eye[2]>1.8);await wait(850);
 d.querySelector('#reset').click();await wait(100);const p=api.projectFloor(-18.5,6);for(let i=0;i<2;i++){c.dispatchEvent(new w.PointerEvent('pointerdown',{pointerType:'touch',pointerId:10,clientX:p.x,clientY:p.y,bubbles:true}));c.dispatchEvent(new w.PointerEvent('pointerup',{pointerType:'touch',pointerId:10,clientX:p.x,clientY:p.y,bubbles:true}));}
 check('Touch double tap enters walk mode',api.mode==='walk');await wait(1800);check('Touch target reached',Math.hypot(api.eye[0]+18.5,api.eye[2]-6)<.25);
 d.querySelector('#reset').click();await wait(100);c.dispatchEvent(new w.MouseEvent('dblclick',{clientX:5,clientY:5,bubbles:true}));check('Outside tap leaves overview',api.mode==='orbit');check('No renderer errors',!d.querySelector('#error').textContent);
}catch(e){check(e.message,false);}
document.querySelector('#summary').textContent=results.filter(r=>r.pass).length+'/'+results.length+' passed';for(const t of results){const p=document.createElement('p');p.textContent=(t.pass?'PASS ':'FAIL ')+t.name;document.body.append(p);}
</script>

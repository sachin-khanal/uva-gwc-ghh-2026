<!doctype html><meta charset="utf-8"><title>Floor demo checks</title><p id="summary">Running</p><iframe id="demo" src="floor1.html" style="width:1200px;height:800px"></iframe><script type="module">
import {rooms,createModel,canMove,point} from './floor1-model.js';
const model=createModel();
const results=[];const check=(name,pass)=>results.push({name,pass});const frame=document.querySelector('iframe');await new Promise(r=>frame.onload=r);const w=frame.contentWindow,d=frame.contentDocument;await new Promise(r=>setTimeout(r,1500));check('Renderer initialized',d.body.dataset.ready==='true'&&!d.querySelector('#error').textContent);check('23 marked spaces',w.floorDemo?.rooms===23);check('Actual 3D triangles',w.floorDemo?.triangles>1000);d.querySelector('#walk').click();check('Walk mode enters',w.floorDemo.mode==='walk');const before=w.floorDemo.eye;d.querySelector('[data-move="forward"]').click();check('Walk advances',w.floorDemo.eye.some((v,i)=>v!==before[i]));d.querySelectorAll('.place')[6].click();check('Room selection works',d.querySelectorAll('.place')[6].classList.contains('selected'));d.querySelector('#orbit').click();check('Overview restores',w.floorDemo.mode==='orbit');check('Outside movement rejected',!w.floorDemo.canMove(999,999));d.querySelector('#roof').click();check('Ceilings toggle',d.querySelector('#roof').checked);frame.style.width='390px';await new Promise(r=>setTimeout(r,200));check('Mobile no horizontal overflow',d.documentElement.scrollWidth<=390);check('Lobby has no enclosing walls',canMove(...[point([105,365])[0],point([105,365])[2]],model.walls));check('Cafe frontage is open',canMove(point([265,349])[0],point([265,349])[2],model.walls));check('All office and meeting entrances signed',rooms.filter(r=>['office','meeting'].includes(r.type)).every(r=>r.sign&&r.entry));check('Door openings remain passable',rooms.filter(r=>['office','meeting'].includes(r.type)).every(r=>canMove(r.entry[0],r.entry[2],model.walls)));const initialZoom=w.floorDemo.zoomDistance;d.querySelector('#zoom-in').click();check('Zoom button takes a small step',w.floorDemo.zoomDistance<initialZoom&&w.floorDemo.zoomDistance>initialZoom*.8);for(let i=0;i<80;i++)d.querySelector('#zoom-in').click();check('Overview zoom has close limit',w.floorDemo.zoomDistance>=18);d.querySelector('#zoom-fit').click();check('Fit restores full building',w.floorDemo.zoomDistance===62);d.querySelector('#walk').click();check('Low walls remain enabled when walking',d.querySelector('#cutaway').checked);for(let i=0;i<80;i++)d.querySelector('#zoom-in').click();check('Walking zoom has close limit',w.floorDemo.fieldOfView>=.35);d.querySelector('#zoom-fit').click();document.querySelector('#summary').textContent=results.filter(t=>t.pass).length+'/'+results.length+' passed';for(const t of results){const p=document.createElement('p');p.textContent=(t.pass?'PASS ':'FAIL ')+t.name;document.body.append(p);}
</script>
